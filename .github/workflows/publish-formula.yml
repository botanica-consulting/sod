name: Publish Homebrew formula

# Re-run ONLY the tap publish for a release that already exists — e.g. after rotating
# HOMEBREW_TAP_TOKEN — without rebuilding, re-signing or re-attesting its artifacts.
# release.yml runs the same script on every tag build; this is the manual retry.
#
#   gh workflow run publish-formula.yml -f tag=v0.2.1
#
# Opens (or reports) the "sod <version>" PR on botanica-consulting/homebrew-tap; a human
# merges it to publish, exactly as on the tag build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the formula for (e.g. v0.2.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Check out main (this workflow's ref) so the CURRENT script runs; it reads the release's
      # commit and formula template from the tag itself, which needs the tags fetched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render formula and open the tap PR
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SOD_TAG: ${{ inputs.tag }}   # GITHUB_REF_NAME can't be overridden, so the script takes this
        run: bash scripts/publish-formula.sh
